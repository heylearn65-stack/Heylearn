<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D4FBF">
<meta name="description" content="HeyLearn – বাংলাভাষীদের জন্য ইংরেজি শেখার অ্যাপ">
<title>HeyLearn</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="heyLearn-icon-192.png">
<link rel="apple-touch-icon" href="heyLearn-icon-192.png">

<style>
:root{
  --bg:#F4F6FB;--card:#FFFFFF;--ink:#1D2742;--mute:#55627F;--line:#E6EAF3;
  --blue:#4A86F7;--blue-d:#1D4FBF;--blue-s:#E7EFFE;
  --green:#2DA866;--green-s:#DFF5E8;
  --yellow:#C98A00;--yellow-s:#FFF3CF;
  --purple:#7A5AF0;--purple-s:#ECE7FF;
  --red:#E5564D;--red-s:#FDE7E5;
  --shadow:0 4px 14px rgba(40,60,120,.08);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1527;--card:#1A2240;--ink:#EBF0FF;--mute:#AAB5D4;--line:#2A3459;--yellow:#F2B93B;
  --blue-s:#1F2E57;--green-s:#18382B;--yellow-s:#3C3216;--purple-s:#2B2652;--red-s:#40211F;--shadow:0 4px 14px rgba(0,0,0,.3);}}
:root[data-theme="dark"]{
  --bg:#0F1527;--card:#1A2240;--ink:#EBF0FF;--mute:#AAB5D4;--line:#2A3459;--yellow:#F2B93B;
  --blue-s:#1F2E57;--green-s:#18382B;--yellow-s:#3C3216;--purple-s:#2B2652;--red-s:#40211F;--shadow:0 4px 14px rgba(0,0,0,.3);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Hind Siliguri','Nunito',system-ui,sans-serif;font-size:17px;line-height:1.5}
.en{font-family:'Nunito','Hind Siliguri',system-ui,sans-serif}
.phone{width:100%;max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
@media (min-width:520px){body{padding:22px 0;background:#DDE4F2}
  .phone{height:min(860px,100%);border-radius:34px;box-shadow:0 20px 60px rgba(30,50,110,.25);border:1px solid var(--line)}}
.view{flex:1;overflow-y:auto;padding:18px 18px 24px}
.nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px 8px}
.nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;border-radius:12px}
.nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--blue)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3,p{margin:0}
.h1{font-size:24px;font-weight:700}.h2{font-size:19px;font-weight:700}.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mt{margin-top:14px}.mt2{margin-top:22px}
.btn{width:100%;border:0;border-radius:16px;padding:14px;font:inherit;font-weight:600;font-size:17px;background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 6px 14px rgba(74,134,247,.3)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--blue-s);color:var(--blue-d);box-shadow:none}
.btn.green{background:var(--green);box-shadow:0 6px 14px rgba(45,168,102,.3)}
.btn[disabled]{opacity:.45;box-shadow:none}
.chip{display:inline-block;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.back{border:0;background:var(--card);width:40px;height:40px;border-radius:14px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);font-size:20px;flex:none}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s}
.tile{border-radius:20px;padding:16px;border:0;text-align:left;font:inherit;color:var(--ink);cursor:pointer;width:100%}
.tile b{display:block;font-size:17px}.tile span{font-size:13px;color:var(--mute)}
.c-blue{background:var(--blue-s)}.c-green{background:var(--green-s)}.c-yellow{background:var(--yellow-s)}.c-purple{background:var(--purple-s)}.c-red{background:var(--red-s)}
.ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px;flex:none}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}.hd .h2{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-top:10px}
.tabc{flex:none;border:0;border-radius:99px;padding:8px 16px;font:inherit;font-weight:600;font-size:14px;background:var(--card);color:var(--mute);cursor:pointer;box-shadow:var(--shadow)}
.tabc.on{background:var(--blue);color:#fff}
.mini{border:0;background:var(--blue-s);color:var(--blue-d);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;flex:none}
.mini.on{background:var(--yellow-s);color:var(--yellow)}
.pic2{width:64px;height:64px;border-radius:18px;background:var(--blue-s);display:grid;place-items:center;font-size:36px}
.search{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;font:inherit;margin-top:6px}
/* splash */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:linear-gradient(170deg,#3F7DF5,#7FB0FF 70%,#CFE2FF);color:#fff}
.bubble{width:132px;height:112px;background:#fff;border-radius:38px 38px 38px 10px;display:grid;place-items:center;font-family:'Nunito';font-weight:800;font-size:44px;color:var(--blue-d);box-shadow:0 14px 30px rgba(20,50,130,.3);margin-bottom:22px;animation:pop .7s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 10px rgba(229,86,77,.2)}50%{box-shadow:0 0 0 24px rgba(229,86,77,.08)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.splash h1{font-family:'Nunito';font-size:40px;font-weight:800}
.splash p{opacity:.95;margin:6px 0 34px;font-size:17px}
.splash .btn{background:#fff;color:var(--blue-d);max-width:280px;box-shadow:0 8px 20px rgba(20,50,130,.25)}
/* cards */
.flash{text-align:center;padding:22px 16px}
.pic{font-size:96px;line-height:1.1;background:var(--blue-s);border-radius:28px;padding:18px 0;margin-bottom:14px}
.word{font-family:'Nunito';font-size:38px;font-weight:800}
.spk{border:0;background:var(--blue-s);color:var(--blue-d);width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.bn{font-size:28px;font-weight:700;color:var(--green)}
.bn2{font-size:19px;font-weight:700;color:var(--green)}
.ex{background:var(--bg);border-radius:16px;padding:12px 14px;text-align:left;margin-top:14px}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--blue);width:22px;border-radius:99px}
.opt{width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px 16px;font:inherit;font-size:18px;font-weight:600;cursor:pointer;margin-top:10px;font-family:'Nunito','Hind Siliguri'}
.opt.ok{border-color:var(--green);background:var(--green-s)}.opt.no{border-color:var(--red);background:var(--red-s);animation:shake .3s}
.opt.sel{border-color:var(--blue);background:var(--blue-s)}
.opt[disabled]{cursor:default}
.eopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eopts .opt{text-align:center;font-size:48px;padding:12px;margin:0}
.ring{--p:42;width:150px;height:150px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-weight:700;font-size:30px;line-height:1.1}
.ring small{display:block;font-size:12px;color:var(--mute);font-weight:500}
.ring.sm{width:84px;height:84px}.ring.sm div{width:64px;height:64px;font-size:17px}
.skill{margin-top:12px}.skill .bar{height:9px}
.week{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:10px}
.week div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.week i{display:block;background:var(--blue);border-radius:8px 8px 4px 4px;margin-bottom:4px}
textarea{width:100%;min-height:120px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:12px;font:inherit;font-size:18px;font-family:'Nunito','Hind Siliguri';resize:vertical}
.sent{padding:12px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);margin-top:10px;cursor:pointer;font-size:18px;font-family:'Nunito'}
.sent em{display:block;font-style:normal;color:var(--green);font-family:'Hind Siliguri';font-size:15px;margin-top:4px}
.sent b{color:var(--blue-d)}
.toggle{width:46px;height:26px;border-radius:99px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--blue)}.toggle.on::after{left:23px}
.list .row{padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}.list .row:last-child{border:0}
.stars{font-size:54px;letter-spacing:6px}
.confetti{font-size:70px;animation:pop .6s ease-out}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:40px;cursor:pointer;box-shadow:0 0 0 12px var(--blue-s)}
.mic.live{background:var(--red);animation:pulse 1s infinite}
.wave{display:flex;align-items:center;gap:3px;height:36px;flex:1}
.wave i{flex:1;background:var(--blue);border-radius:3px;opacity:.7}
.wd{display:inline-block;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;margin:4px;font-family:'Nunito';font-weight:700;font-size:18px;cursor:pointer}
.slot{min-height:84px;border:2px dashed var(--line);border-radius:16px;padding:6px;background:var(--card)}
.slot.ok{border-color:var(--green);background:var(--green-s)}.slot.no{border-color:var(--red);background:var(--red-s);animation:shake .3s}
.bd{text-align:center;padding:14px 8px}.bd.lock{opacity:.45;filter:grayscale(1)}
.bd .ico{margin:0 auto 8px;width:56px;height:56px;font-size:30px}
.dotw{display:flex;gap:5px;margin-top:8px}.dotw i{flex:1;height:8px;border-radius:99px;background:var(--line)}.dotw i.on{background:var(--yellow)}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;z-index:9;max-width:85%;text-align:center;box-shadow:var(--shadow)}
.formula{background:var(--yellow-s);border-radius:16px;padding:12px 14px;margin-top:12px;font-family:'Nunito','Hind Siliguri';font-weight:700}
.sel-time{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:4px 8px;font:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- polish: বড় লেখা, স্পষ্ট কার্ড, সহজে ট্যাপ ---------- */
.view{padding:20px 18px 28px;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.h1{font-size:28px;line-height:1.25}.h2{font-size:21px}
.sub{font-size:15px}
.card{border:1px solid var(--line);box-shadow:0 6px 18px rgba(40,60,120,.07)}
.btn{min-height:54px;font-size:18px;border-radius:18px}
.back{width:44px;height:44px;border:1px solid var(--line)}
.mini{width:40px;height:40px}.spk{width:48px;height:48px}
.bar{height:12px}
.ico{width:52px;height:52px;font-size:27px;border-radius:16px}
.tile{padding:18px;border:1px solid var(--line);box-shadow:0 4px 12px rgba(40,60,120,.05)}
.tile b{font-size:18px}.tile span{font-size:14px;color:var(--mute)}
.chip{font-size:14px;padding:5px 13px}
.tabc{padding:10px 18px;font-size:15px}
.nav{padding:8px 4px 10px;box-shadow:0 -6px 18px rgba(40,60,120,.06)}
.nav button{font-size:12.5px;font-weight:600;gap:3px}
.nav button svg{width:24px;height:24px;box-sizing:content-box;padding:4px 16px;border-radius:99px;transition:background .2s}
.nav button.on svg{background:var(--blue-s)}
.opt{display:flex;align-items:center;gap:12px;padding:15px 16px;font-size:19px;min-height:58px}
.eopts .opt{justify-content:center}
.lt{width:32px;height:32px;border-radius:10px;background:var(--blue-s);color:var(--blue-d);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.opt.ok .lt{background:var(--green);color:#fff}.opt.no .lt{background:var(--red);color:#fff}
.stick{position:sticky;bottom:0;margin-top:16px;padding:16px 0 4px;background:linear-gradient(to bottom,transparent,var(--bg) 30%);z-index:2}
.pic{font-size:104px}.word{font-size:42px}
.flash{padding:24px 18px}
.list .row{padding:16px 4px;min-height:56px}
.toggle{width:52px;height:30px}.toggle::after{width:24px;height:24px}.toggle.on::after{left:25px}
.sent{font-size:19px;padding:14px 16px}


button.card{text-align:left;font:inherit;color:var(--ink);width:100%;cursor:pointer}
/* ===== Professional theme ===== */
:root{--bg:#F2F5FB;--ink:#14213D;--mute:#5B6785;--line:#E3E8F2;--blue:#2F66E0;--blue-d:#1D4FBF;--blue-s:#E3ECFD;--green:#1E9E62;--green-s:#DDF4E8;--yellow:#B7791F;--yellow-s:#FDF1D3;--purple:#6D4AE0;--purple-s:#EAE5FD;--red:#D8473F;--red-s:#FCE6E4;--shadow:0 8px 24px rgba(20,33,61,.07),0 1px 3px rgba(20,33,61,.06)}
[data-theme="dark"]{--bg:#0B1220;--card:#151E36;--ink:#EAF0FF;--mute:#A3B0D0;--line:#243055;--blue:#5B8CFF;--blue-d:#3F6FE8;--blue-s:#1B2A55;--green:#3CC186;--green-s:#143528;--yellow:#F0B94A;--yellow-s:#3A3014;--purple:#9B84FF;--purple-s:#2A2554;--red:#F0716A;--red-s:#3E2020;--shadow:0 8px 24px rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#151E36;--ink:#EAF0FF;--mute:#A3B0D0;--line:#243055;--blue:#5B8CFF;--blue-d:#3F6FE8;--blue-s:#1B2A55;--green:#3CC186;--green-s:#143528;--yellow:#F0B94A;--yellow-s:#3A3014;--purple:#9B84FF;--purple-s:#2A2554;--red:#F0716A;--red-s:#3E2020;--shadow:0 8px 24px rgba(0,0,0,.35)}}
.view{background:linear-gradient(180deg,color-mix(in srgb,var(--blue) 9%,var(--bg)) 0,var(--bg) 240px)}
.card{border:1px solid var(--line);border-radius:18px}
.btn{background:linear-gradient(135deg,var(--blue-d),var(--blue));box-shadow:0 8px 18px color-mix(in srgb,var(--blue) 35%,transparent);letter-spacing:.2px}
.nav{border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,33,61,.05)}
.tile{border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:var(--shadow)}
.h1{letter-spacing:-.3px;color:var(--ink)}
.chip{letter-spacing:.2px}
.opt{border-radius:14px}
</style>
</head>

 if(S.sp.state==='listening')return;
 S.sp.state='listening';S.sp.note='';render(true);
 if(!SR){noMic('এই ব্রাউজারে মাইক সমর্থিত নয়। Chrome ব্যবহার করুন।');return}
 try{const r=new SR();r.lang='en-US';r.interimResults=false;
  r.onresult=e=>scoreSpeech(e.results[0][0].transcript,e.results[0][0].confidence);
  r.onerror=()=>{if(S.sp.state==='listening')noMic('মাইক চালু করা যায়নি। মাইক্রোফোনের অনুমতি দিয়ে আবার চেষ্টা করুন।')};
  r.onend=()=>{if(S.sp.state==='listening'){S.sp.state='idle';S.sp.note='কিছু শোনা যায়নি, আবার চেষ্টা করুন।';render(true)}};
  r.start()}catch(e){noMic('মাইক চালু করা যায়নি। মাইক্রোফোনের অনুমতি দিয়ে আবার চেষ্টা করুন।')}
}

vcard:()=>{const w=FR[S.wi];return `<div class="view">${topbar(`${S.wi+1}/6`,(S.wi+1)/6*40)}
 <div class="card flash mt2"><div class="pic">${w.e}</div>
  <div class="row" style="justify-content:center"><span class="word">${w.en}</span><button class="spk" data-a="say" data-t="${w.en}" aria-label="উচ্চারণ শুনি">🔊</button></div>
  <p class="sub en">${w.ip} · ${w.pr}</p><p class="bn mt">${w.bn}</p>
  <div class="ex"><p class="en" style="font-size:18px">${w.ex}</p><p class="sub">${w.exb}</p><button class="spk mt" style="width:auto;padding:0 14px;border-radius:99px;font-size:14px" data-a="say" data-t="${w.ex}">🔊 Listen to the sentence</button></div></div>
 <div class="dots">${FR.map((_,i)=>`<i class="${i===S.wi?'on':''}"></i>`).join('')}</div>
 <div class="stick"><div class="row"><button class="btn ghost" data-a="vprev" ${S.wi?'':'disabled'} style="flex:1">আগের</button><button class="btn" data-a="vnext" style="flex:2">${S.wi<5?'পরের শব্দ':'অনুশীলনে যাই'}</button></div></div></div>`},

done:()=>`<div class="view" style="text-align:center"><div class="confetti mt2">🎉</div><h1 class="h1 mt">Lesson Complete!</h1><p class="sub">আপনি ৬টি নতুন শব্দ শিখলে</p>
 <div class="stars mt">${S.lscore>=5?'⭐⭐⭐':S.lscore>=3?'⭐⭐☆':'⭐☆☆'}</div>
 <div class="grid2 mt2"><div class="card"><p class="sub">Correct</p><p class="h2 en">${S.lscore}/6</p></div><div class="card"><p class="sub">Total XP</p><p class="h2 en">${P.xp}</p></div></div>

 <div class="stick"><button class="btn" data-a="story">Read the story</button><button class="btn ghost mt" data-a="lessonq">Practise Again</button></div></div>`,

story:()=>{const hl=t=>FR.reduce((s,w)=>s.replace(new RegExp('\\b('+w.en+'s?)\\b','i'),'<b>$1</b>'),t);
 return `<div class="view">${head('Story')}<h1 class="h1 en">${P.level==='adv'?'Planting Trees, Growing Futures':'Rumi and the Mango Tree'}</h1><p class="sub">বাক্যে ট্যাপ করলে বাংলা অর্থ দেখাবে</p>
 <button class="btn ghost mt" data-a="say" data-t="${STORY.map(s=>s[0]).join(' ')}">🔊 Listen to the full story</button>
 ${STORY.map((s,i)=>`<div class="sent" data-a="tog" data-i="${i}" role="button" tabindex="0">${hl(s[0])}${S.open[i]?`<em>${s[1]}</em>`:''}</div>`).join('')}
 <div class="stick"><button class="btn" data-a="writing">Write It Yourself</button></div></div>`},

writing:()=>{const f=S.fb;return `<div class="view">${head('Write It Yourself ✍️')}${P.level==='adv'?`<p class="sub">আজকের বিষয়: <b>${wrt().t}</b>। ৫–৬টি বাক্যের একটি অনুচ্ছেদ লিখুন।</p>`:`<p class="sub">আপনার প্রিয় ফল নিয়ে ইংরেজিতে ১–২টি বাক্য লিখুন।</p>`}
 ${P.level==='adv'?`<div class="card mt c-purple"><p class="sub">Structure</p><p class="en">${wrt().h.join('<br>')}</p><p class="sub en mt">${wrt().w}</p></div>`:`<div class="card mt c-purple"><p class="sub">Hint</p><p class="en"><b>I like ___ because it is ___.</b></p><p class="sub en">sweet · juicy · yellow · fresh</p></div>`}
 <textarea id="ta" class="mt" placeholder="এখানে লিখুন…" aria-label="আপনার লেখা">${esc(S.text)}</textarea>
 ${f?`<div class="card mt" style="background:${f.good?'var(--green-s)':'var(--yellow-s)'}"><b>${f.title}</b><p class="sub" style="color:var(--ink)">${f.msg}</p></div>`:''}
 <div class="stick"><button class="btn ghost" data-a="check">Check My Writing</button><button class="btn green mt" data-a="finish">Complete Lesson</button></div></div>`},

listen:()=>{const h=[14,22,10,30,18,26,12,32,20,14,28,16,24,10,30,18,22,12,26,16];
 return `<div class="view">${head('Listening')}

 <div class="card mt"><div class="row"><button class="spk" style="width:54px;height:54px;background:var(--blue);color:#fff" data-a="playconv" aria-label="চালাই">${S.ls.play?'⏸':'▶'}</button><div class="wave">${h.map(x=>`<i style="height:${x}px"></i>`).join('')}</div></div>
 <button class="btn ghost mt" data-a="showtr">${S.ls.show?'লেখা লুকাই':'লেখা দেখি'}</button>
 ${S.ls.show?CONV.map(c=>`<p class="en mt"><b>${c.n}:</b> ${c.t}</p>`).join(''):''}</div>
 <div class="stick"><button class="btn" data-a="lq">Answer the Questions</button></div></div>${nav('practice')}`},

speak:()=>{const s=S.sp,r=s.res,t=SPS[s.i];
 return `<div class="view">${head('Speaking Practice')}
 <div class="card c-blue"><p class="sub" style="color:var(--ink)">মাইকে ট্যাপ করে বাক্যটি স্পষ্ট করে বলুন।</p></div>
 <div class="card mt flash"><div class="row" style="justify-content:center"><p class="en" style="font-size:25px;font-weight:800">${t}</p><button class="spk" data-a="say" data-t="${t}" aria-label="শুনি">🔊</button></div></div>

 ${s.note?`<p class="sub" style="text-align:center">${esc(s.note)}</p>`:''}
 ${r?`<div class="card mt"><div class="row"><div>${ring(r.total,'স্কোর',1)}</div><div style="flex:1">${[['উচ্চারণ',r.pron],['সাবলীলতা',r.flu],['নির্ভুলতা',r.acc]].map(x=>`<div class="row sp sub"><span>${x[0]}</span><b class="en" style="color:var(--green)">${Math.min(100,x[1])}</b></div>`).join('')}</div></div></div>`:''}

progress:()=>{const f=S.pf,vp=pctOf(P.learned.length,W.length),gp=pctOf(P.gdone.length,G.length);
 const tabs=chips([['overview','Overview'],['vocab','Words'],['grammar','Grammar']],f,'pf');
 let body='';
 if(f==='overview')body=`<div class="card mt">${ring(lvPct(),LV[lvl()].en)}<p class="sub" style="text-align:center;margin-top:10px">Keep going, you are doing well!</p></div>
  <div class="grid2 mt">${[['📚','শব্দভান্ডার',vp,'purple'],['✏️','ব্যাকরণ',gp,'green'],['🎙️','স্পিকিং',P.speak,'yellow'],['🎧','লিসেনিং',P.listen,'blue']].map(s=>`<div class="card c-${s[3]}" style="box-shadow:none"><div class="row"><span style="font-size:22px">${s[0]}</span><div><p class="sub">${s[1]}</p><p class="h2 en">${s[2]}%</p></div></div></div>`).join('')}</div>
  <div class="card mt"><b>This Week</b><div class="week">${weekData().map(d=>`<div><i style="height:${d[1]}px"></i>${d[0]}</div>`).join('')}</div></div>`;
 else if(f==='vocab')body=`<div class="grid2 mt"><div class="card"><p class="sub">Words Learned</p><p class="h1 en">${P.learned.length}/${W.length}</p></div><div class="card"><p class="sub">Saved</p><p class="h1 en">${P.marks.length}</p></div></div>
  <div class="card mt"><b>By Category</b>${[['ফল',FR],['সাধারণ শব্দ',W.filter(w=>w.c==='g')]].map(c=>{const n=c[1].filter(w=>P.learned.includes(w.en)).length;return `<div class="skill"><div class="row sp sub"><span>${c[0]}</span><span class="en">${n}/${c[1].length}</span></div><div class="bar"><i style="width:${pctOf(n,c[1].length)}%;background:var(--purple)"></i></div></div>`}).join('')}</div>`;
 else body=`<div class="card mt"><b>Progress by Topic</b>${G.map(g=>`<div class="skill"><div class="row sp sub"><span class="en">${g.en}</span><span>${P.gdone.includes(g.k)?'✅ শেষ':'বাকি'}</span></div><div class="bar"><i style="width:${P.gdone.includes(g.k)?100:0}%;background:var(--green)"></i></div></div>`).join('')}</div>`;
 return `<div class="view"><h1 class="h1">Progress</h1><p class="sub">Small steps, big progress</p>${tabs}${body}</div>${nav('progress')}`},

level:()=>{const k=lvl();
 return `<div class="view">${head('My Level')}
 ${LV.map((l,i)=>`<div class="card mt row" style="${i>k?'opacity:.6':''}"><div class="ico c-${l.col}">${l.ic}</div><div style="flex:1"><b class="en">${l.en} <span class="sub">· ${l.bn}</span></b><p class="sub">${l.d}</p></div><span>${i<k?'✅':i===k?'<span class="chip c-green" style="color:var(--green)">In progress</span>':'🔒'}</span></div>`).join('')}
 ${k<3?`<div class="card mt c-purple" style="box-shadow:none"><div class="row"><span style="font-size:40px">⛰️</span><div style="flex:1"><b>পরের লেভেল: ${LV[k+1].bn}</b><p class="sub">আর ${LV[k+1].min-P.xp} XP বাকি</p><div class="bar mt" style="margin-top:8px"><i style="width:${lvPct()}%;background:var(--green)"></i></div></div></div></div>`:''}</div>${nav('profile')}`},

badges:()=>{const st={lesson:!!P.flags.lesson,streak:streak()>=7,words:P.learned.length>=10,quiz:!!P.flags.quiz,speak:!!P.flags.speak,listen:!!P.flags.listen,daily:!!P.flags.daily,gram:P.gdone.length>=3};
 return `<div class="view">${head('Achievements')}<p class="sub">${BADGES.filter(b=>st[b[3]]).length}/${BADGES.length}টি অর্জন হয়েছে</p>
 <div class="grid2 mt">${BADGES.map(b=>`<div class="card bd ${st[b[3]]?'':'lock'}"><div class="ico c-yellow">${b[0]}</div><b>${b[1]}</b><p class="sub">${b[2]}</p></div>`).join('')}</div></div>${nav('profile')}`},

profile:()=>`<div class="view"><div class="row"><button data-a="photo" aria-label="ছবি পরিবর্তন করুন" style="width:72px;height:72px;border-radius:50%;border:0;padding:0;background:var(--blue-s);font-size:36px;cursor:pointer;overflow:hidden;flex:none">${P.photo?`<img src="${P.photo}" alt="" style="width:100%;height:100%;object-fit:cover">`:'🙂'}</button><div><h1 class="h1" data-a="editname" style="cursor:pointer">${P.name||'Learner'} ✏️</h1><p class="sub">${P.level==='adv'?'Advanced':'Basic'} level · tap to change photo or name</p><span class="chip c-green" style="color:var(--green)">${LV[lvl()].ic} ${LV[lvl()].en} · ${P.xp} XP</span></div></div>
 <div class="card mt list">
  <div class="row sp" data-a="go" data-s="level"><span>🏅 My Level</span><span class="sub">›</span></div>

  <div class="row sp" data-a="go" data-s="help"><span>❓ Help</span><span class="sub">›</span></div>
  <div class="row sp" data-a="go" data-s="about"><span>ℹ️ About</span><span class="sub">›</span></div>
  <div class="row sp" data-a="backup"><span>💾 Backup Progress</span><span class="sub">›</span></div>
  <div class="row sp" data-a="restore"><span>📥 Restore Progress</span><span class="sub">›</span></div>
 </div>
 <div class="card mt"><b>Daily Goal</b><p class="sub">How many minutes will you study daily?</p>${chips([[10,'১০ মিনিট'],[15,'১৫ মিনিট'],[20,'২০ মিনিট'],[30,'৩০ মিনিট']],P.goal,'goal')}</div>
 </div>${nav('profile')}`
};

{const g0=go,b0=back;go=function(s,o){stopAudio();return g0(s,o)};back=function(){stopAudio();return b0()}}

function render(keep){

function checkWriting(){
 const t=S.text.trim(),n=t.split(/\s+/).filter(Boolean).length;
 const used=FR.filter(w=>t.toLowerCase().includes(w.en)).map(w=>w.en);
 if(n<4){S.fb={good:false,title:'আরেকটু লিখুন',msg:'অন্তত ৪টি শব্দের একটি বাক্য লিখুন।'};return}
 const tips=[];
 if(!/^[A-Z]/.test(t))tips.push('বাক্য বড় হাতের অক্ষর দিয়ে শুরু করুন।');
 if(!/[.!?]$/.test(t))tips.push('বাক্যের শেষে দাঁড়ি (.) দিন।');
 if(!used.length)tips.push('এই পাঠের একটি শব্দ (যেমন mango) ব্যবহার করে দেখুন।');
 S.fb=tips.length?{good:false,title:'প্রায় হয়ে গেছে!',msg:tips.join(' ')}:{good:true,title:'চমৎকার লিখেছেন! 🎉',msg:`আপনি ${used.join(', ')} শব্দটি ব্যবহার করেছেন। (আসল অ্যাপে এআই টিউটর ব্যাকরণও দেখে দেবে।)`};
}
function act(a,d){
 switch(a){
 case 'say':say(d.t);return;
 case 'toast':toast(d.m);return;
 case 'back':return back();
 case 'tab':return go(d.k,{reset:true});
 case 'wtheme':S.wt=+d.i;return go('wtheme');
 case 'wlearn':{const u=ADV_T[S.wt];if(!u[2].every(w=>P.learned.includes(w[0]))){u[2].forEach(w=>{if(!P.learned.includes(w[0]))P.learned.push(w[0])});addXp(10);save()}return render(true)}
 case 'eqstart':S.vq={i:0,sel:-1,sc:0,qs:makeVQ('ear'),mode:'ear'};go('vq',{replace:true});return autoSay();
 case 'pqstart':S.vq={i:0,sel:-1,sc:0,qs:makeVQ('pic'),mode:'pic'};return go('vq',{replace:true});
 case 'vqstart':S.vq={i:0,sel:-1,sc:0,qs:makeVQ()};return go('vq',{replace:true});
 case 'vqans':{const v=S.vq;if(v.sel<0){v.sel=+d.i;const q=v.qs[v.i];if(v.sel===q.a)v.sc++;else q.m=1}return render(true)}
 case 'vqnext':{const v=S.vq;v.i++;v.sel=-1;if(v.i>=v.qs.length){addXp(v.sc*3);addQA(v.sc,v.qs.length);markDone('q')}render(true);return autoSay()}
 case 'backup':{const o=Object.assign({},P);delete o.photo;const c=btoa(unescape(encodeURIComponent(JSON.stringify(o))));if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(c).then(()=>toast('ব্যাকআপ কোড কপি হয়েছে। নিরাপদ জায়গায় রাখুন')).catch(()=>prompt('এই কোডটি কপি করে রাখুন',c));else prompt('এই কোডটি কপি করে রাখুন',c);return}
 case 'restore':{const c=prompt('ব্যাকআপ কোডটি এখানে পেস্ট করুন');if(!c)return;try{const o=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));if(typeof o!=='object'||!Array.isArray(o.learned))throw 0;Object.keys(P).forEach(k=>delete P[k]);Object.assign(P,o);save();location.reload()}catch(e){toast('কোডটি সঠিক নয়')}return}
 case 'go':if(d.s==='vocab'&&P.level==='adv')return go('wbank');return go(d.s);
 case 'photo':{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=192;const x=c.getContext('2d');const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,192,192);P.photo=c.toDataURL('image/jpeg',.82);save();render(true)};im.onerror=()=>toast('ছবিটি খোলা যায়নি');im.src=r.result};r.readAsDataURL(f)};i.click();return}
 case 'editname':{const n=prompt('Your name',P.name||'');if(n&&n.trim()){P.name=n.trim().slice(0,24);save();render(true)}return}
 case 'gopen':S.g={t:+d.i,q:0,sel:-1,sc:0};return go('grule');
 case 'gstart':S.g.q=0;S.g.sel=-1;S.g.sc=0;return go('gq',{replace:true});
 case 'gans':if(S.g.sel<0){S.g.sel=+d.i;if(S.g.sel===GB[S.g.t].q[S.g.q][2])S.g.sc++}return render(true);
 case 'gnext':{S.g.q++;S.g.sel=-1;if(S.g.q>=GB[S.g.t].q.length){addXp(S.g.sc*4);P.gt=P.gt||{};const gT=GB[S.g.t].t;P.gt[gT]=Math.max(P.gt[gT]||0,S.g.sc);addQA(S.g.sc,GB[S.g.t].q.length);markDone('g')}return render(true)}
 case 'dsay':return sayEn(d.t);
 case 'dlearn':todayW().forEach(w=>{if(!P.learned.includes(w[0]))P.learned.push(w[0])});markDone('w');return render(true);
 case 'wsave':{const v=$('#wr').value.trim();if(v.length<20)return toast('কমপক্ষে কয়েকটি বাক্য লিখুন');P.wr[dstr()]=v;markDone('wr');toast('সংরক্ষিত হয়েছে ✅');return render(true)}
 case 'lvlask':P.obd=0;save();return onboard();
 case 'bell':return toast(P.days.includes(dstr())?'চমৎকার! Today’s Lesson শুরু হয়ে গেছে ✅ স্ট্রিক: '+streak()+' days':'You have not studied yet today. Finish one lesson to keep your streak!');
 case 'lesson':return go('lesson');
 case 'startvocab':S.wi=0;return go('vcard');
 case 'vprev':if(S.wi>0)S.wi--;return render();
 case 'vnext':{const w=FR[S.wi];if(!P.learned.includes(w.en)){P.learned.push(w.en);save()}if(S.wi<5){S.wi++;return render()}return launch('lesson')}
 case 'lessonq':return launch('lesson',true);
 case 'mark':{const i=P.marks.indexOf(d.w);if(i<0){P.marks.push(d.w);toast('★ সেভ করা হয়েছে')}else P.marks.splice(i,1);save();return render(true)}
 case 'vf':S.vf=d.k;return render();
 case 'search-focus':{const i=$('#vs');if(i)i.focus();return}
 case 'flash':return launch('flash');
 case 'flip':S.fl.flip=!S.fl.flip;return render(true);
 case 'flyes':case 'flno':{const z=S.fl;if(a==='flyes'){z.known++;const w=z.list[z.i];if(!P.learned.includes(w.en))P.learned.push(w.en);save()}
  if(z.i<z.list.length-1){z.i++;z.flip=false;return render()}return showRes('flash',z.known,z.list.length,z.known*2)}
 case 'gtopic':S.gt=d.k;return go('gtopic');
 case 'gprac':return launch('gq');
 case 'mcq':case 'fill':case 'daily':case 'match':return launch(a);
 case 'sent':return launch('sent');
 case 'lq':return launch('listenq');
 case 'gf':S.gf=d.k;return render();
 case 'pf':S.pf=d.k;return render();
 case 'pick':{const z=S.qz;if(z.picked!==null)return;z.picked=+d.i;if(z.picked===z.qs[z.i].ans)z.score++;return render(true)}
 case 'nextq':{const z=S.qz;if(z.i<z.qs.length-1){z.i++;z.picked=null;return render()}return finishQz()}
 case 'again':return launch(S.last==='flash'?'flash':S.last,true);
 case 'ml':{const m=S.mt;m.sel=+d.i;m.bad=null;return render(true)}
 case 'mr':{const m=S.mt;if(m.sel===null)return toast('আগে বাঁ দিক থেকে একটি শব্দ বাছুন');m.moves++;
  if(m.L[m.sel]===m.R[+d.j]){m.done.push(m.L[m.sel].en);m.sel=null;m.bad=null;if(m.done.length===5)return showRes('match',Math.max(1,5-(m.moves-5)),5,Math.max(10,25-(m.moves-5)*3));return render(true)}
  m.bad=[m.sel,+d.j];m.sel=null;render(true);setTimeout(()=>{if(S.screen==='match'){S.mt.bad=null;render(true)}},600);return}
 case 'smadd':{const m=S.sm;if(m.state==='ok')return;m.chosen.push(+d.id);m.state=null;return render(true)}
 case 'smdel':{const m=S.sm;if(m.state==='ok')return;m.chosen=m.chosen.filter(x=>x!==+d.id);m.state=null;return render(true)}
 case 'smchk':{const m=S.sm;const s=m.chosen.map(id=>m.pool.find(x=>x.id===id).w).join(' ');
  if(s===m.qs[m.i][0]){m.state='ok';if(m.tries===0)m.score++}else{m.state='bad';m.tries++}return render(true)}
 case 'smnext':{const m=S.sm;if(m.i<m.qs.length-1){m.i++;smInit();return render()}return showRes('sent',m.score,m.qs.length,m.score*6)}
 case 'tog':S.open[d.i]=!S.open[d.i];return render(true);
 case 'story':return go('story');
 case 'writing':return go('writing');
 case 'check':checkWriting();return render(true);
 case 'finish':P.flags.lesson=1;addXp(20);save();return go('progress',{reset:true});
 case 'playconv':if(S.ls.play){try{speechSynthesis.cancel()}catch(e){}S.ls.play=false;return render(true)}
  S.ls.show=false;playLines(CONV);return render(true);
 case 'showtr':S.ls.show=!S.ls.show;return render(true);
 case 'mic':return mic();
 case 'spnext':S.sp={i:(S.sp.i+1)%SPS.length,state:'idle',res:null,note:''};return render(true);
 case 'spagain':S.sp.state='idle';S.sp.res=null;S.sp.note='';return render(true);
 case 'theme':{const r=document.documentElement;P.theme=d.v==='auto'?null:d.v;if(P.theme)r.dataset.theme=P.theme;else delete r.dataset.theme;save();return render(true)}
 case 'remind':P.remind.on=!P.remind.on;save();P.remind.on?askNotif():toast('রিমাইন্ডার বন্ধ');return render(true);
 case 'goal':P.goal=+d.k;save();return render(true);
 }
}

/* PWA: অফলাইনে চালানোর জন্য */
const APP_VERSION='1.15.0'; // নতুন আপডেট দিলে শুধু এই সংখ্যাটা বাড়ান (যেমন 1.2.0)
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}));
}
(function(){
  var bar;
  function showBar(v){
    if(bar)return;
    bar=document.createElement('div');
    bar.setAttribute('style','position:fixed;top:0;left:0;right:0;z-index:99999;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:#1D4FBF;color:#fff;font:600 14px/1.3 "Hind Siliguri","Nunito",system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.25)');
    bar.innerHTML='<span style="flex:1">New version '+v+' available</span><button id="hl-upd" style="border:0;border-radius:10px;background:#fff;color:#1D4FBF;font:700 14px inherit;padding:8px 14px;cursor:pointer">Update</button><button id="hl-later" aria-label="পরে" style="border:0;background:none;color:#fff;font-size:22px;cursor:pointer">×</button>';
    document.body.appendChild(bar);
    document.getElementById('hl-later').onclick=function(){bar.remove();bar=null};
    document.getElementById('hl-upd').onclick=function(){
      (window.caches?caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}):Promise.resolve())
        .catch(function(){}).then(function(){location.reload()});
    };
  }
  function check(){
    fetch('index.html?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
      var m=t.match(/APP_VERSION\s*=\s*'([^']+)'/);
      if(m&&m[1]!==APP_VERSION)showBar(m[1]);
    }).catch(function(){});
  }
  setTimeout(check,3000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)check()});
})();
</script>

  x.onclick=function(){box.style.display='none';try{sessionStorage.setItem('hl-x','1')}catch(e){}};
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();ev=e;sub.textContent='Add it to your home screen as an app';go.textContent='Install';show()});
  window.addEventListener('appinstalled',function(){box.style.display='none'});
  go.onclick=function(){
    if(ev){ev.prompt();ev.userChoice.finally(function(){ev=null;box.style.display='none'})}
    else if(ios){alert('আইফোনে: Safari-তে নিচের Share (⬆️) বাটন চাপুন → "Add to Home Screen" চাপুন।')}
    else{alert('Chrome-এর ওপরের ডানের ⋮ মেনু চাপুন → "Install app" বা "Add to Home screen" চাপুন।')}
  };
  if(ios){sub.textContent='Share ⬆️ → Add to Home Screen';go.textContent='কীভাবে?';setTimeout(show,1500)}
  else{setTimeout(function(){if(!ev){sub.textContent='মেনু ⋮ → Install app';go.textContent='কীভাবে?';show()}},5000)}
})();
</script>
</body>
</html>
